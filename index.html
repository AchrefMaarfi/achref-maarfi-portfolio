<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&display=swap"

    />
    <meta
      name="theme-color"
      content="#0f0d0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#fffdf8"
      media="(prefers-color-scheme: light)"
    />

    <!--
      Applies the saved theme before first paint. Without this the page renders
      dark (the default on <html>) and then snaps to light for anyone who chose
      it — a visible flash on every navigation.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light') {
            document.documentElement.classList.remove('dark')
            document.documentElement.style.colorScheme = 'light'
          }
        } catch (e) {
          /* private mode / blocked storage — keep the dark default */
        }
      })()
    </script>

    <title>Achref Maarfi | Software Engineer</title>
